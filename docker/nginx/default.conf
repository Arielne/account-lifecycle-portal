# Cấu hình Nginx trong container web (cổng 80).
# Nginx là cửa vào duy nhất: React và backend dùng chung một địa chỉ, nhờ vậy cookie phiên gửi được.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Báo cho backend địa chỉ mà trình duyệt đã gọi, để backend tạo đúng địa chỉ chuyển hướng khi đăng nhập,
    # và IP của người dùng để ghi audit log.
    # Spring đọc các header này khi bật server.forward-headers-strategy (xem docs/02-auth.md), kể cả header
    # do trình duyệt tự gửi. Vì vậy Nginx ghi đè, không nối thêm: X-Forwarded-For chỉ còn IP mà Nginx thấy.
    # Nối thêm ($proxy_add_x_forwarded_for) thì ai cũng gửi được IP giả, Spring lấy IP đầu tiên và ghi vào audit log.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Các header Spring cũng đọc nhưng Nginx không dùng: đặt rỗng để Nginx bỏ hẳn, trình duyệt gửi lên cũng không tới backend.
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Ssl "";

    # 4 đường dẫn do backend xử lý: API, đăng nhập và đăng xuất của Spring Security.
    location /api/ {
        proxy_pass http://backend:8081;
    }
    location /oauth2/ {
        proxy_pass http://backend:8081;
    }
    location /login/oauth2/ {
        proxy_pass http://backend:8081;
    }
    location /logout {
        proxy_pass http://backend:8081;
    }

    # Mọi đường dẫn còn lại thuộc về React. Route như /tai-khoan/123 không có file thật,
    # nên trả index.html để React Router hiển thị đúng trang.
    location / {
        try_files $uri $uri/ /index.html;
    }
}