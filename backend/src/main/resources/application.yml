# Cấu hình của profile mặc định: backend chạy trên máy (IDE hoặc mvnw).
spring:
  application:
    name: alp
  config:
    # Nạp file .env ở gốc repo, đọc như file .properties (phần [.properties] báo cho Spring kiểu file).
    # Đường dẫn ../.env tính từ thư mục backend/, nơi chạy mvnw.
    # optional: không có file thì vẫn chạy; trong Docker, Compose truyền biến môi trường vào sẵn.
    import: optional:file:../.env[.properties]
  # Database Supabase (Session pooler). Giá trị lấy từ .env khi chạy trên máy, từ biến môi trường khi chạy trong Docker.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # Flyway chỉ quản lý schema app và tự tạo schema nếu chưa có; bảng lịch sử của Flyway cũng nằm trong app.
    schemas: app
    # Script ở db/migrations/ (gốc repo), tính từ thư mục backend/ nơi chạy app.
    locations: filesystem:../db/migrations
    # Supabase dùng chung cho chạy thường và demo. Profile demo đã chạy các file seed R__ trong db/seeds/;
    # profile thường không đọc thư mục đó nên Flyway coi các seed là "missing" và chặn app khởi động.
    # repeatable:missing bỏ qua trường hợp này; *:future là giá trị mặc định của Flyway, phải ghi lại vì bị thay.
    ignore-migration-patterns: "*:future,repeatable:missing"
  # Đăng nhập qua KeyCloak (OAuth2 Login, chuẩn OIDC).
  security:
    oauth2:
      client:
        registration:
          # Tên keycloak quyết định đường dẫn /oauth2/authorization/keycloak và /login/oauth2/code/keycloak.
          keycloak:
            client-id: alp-portal
            client-secret: ${KC_PORTAL_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            # KeyCloak trả mã đăng nhập về đây. {baseUrl} là địa chỉ người dùng đang mở (http://localhost hoặc :5173).
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          # Khai báo từng endpoint, không dùng issuer-uri: có issuer-uri thì Spring gọi KeyCloak ngay lúc khởi động
          # (CI không có KeyCloak), còn trong Docker thì gặp lỗi issuer không khớp.
          # Không khai user-info-uri: họ tên, email, role đều lấy từ ID token.
          keycloak:
            # Trình duyệt được chuyển tới trang đăng nhập, nên dùng địa chỉ trình duyệt mở được.
            authorization-uri: ${keycloak.url}/realms/alp/protocol/openid-connect/auth
            # Hai địa chỉ dưới do backend tự gọi, nên dùng địa chỉ backchannel.
            token-uri: ${keycloak.backchannel-url}/realms/alp/protocol/openid-connect/token
            jwk-set-uri: ${keycloak.backchannel-url}/realms/alp/protocol/openid-connect/certs
            user-name-attribute: sub
  # Session lưu ở Redis (Spring Session). Trên máy Redis ở localhost; trong Docker, Compose đặt SPRING_DATA_REDIS_HOST=redis.
  data:
    redis:
      host: localhost
      port: 6379
  # Mail gửi qua SMTP của Mailpit (chỉ giữ mail để xem). Trên máy là localhost; trong Docker, Compose đặt SPRING_MAIL_HOST=mailpit.
  mail:
    host: localhost
    port: 1025

server:
  # Cổng 8080 đã dành cho KeyCloak.
  port: 8081
  # Đọc header X-Forwarded-* do Nginx gửi kèm, để tạo đúng địa chỉ quay về sau khi đăng nhập, đăng xuất.
  forward-headers-strategy: framework
  servlet:
    session:
      # 30 phút không hoạt động thì hết phiên, khớp SSO Session Idle của realm alp.
      timeout: 30m
      cookie:
        # Cookie phiên tên SESSION (tên mặc định của Spring Session); JavaScript không đọc được.
        http-only: true
        same-site: lax

# Địa chỉ KeyCloak. url: địa chỉ trình duyệt mở (trang đăng nhập, đăng xuất).
# backchannel-url: địa chỉ backend gọi để đổi mã lấy token và lấy khóa công khai; trong Docker là http://keycloak:8080.
keycloak:
  url: ${KEYCLOAK_URL:http://localhost:8080}
  backchannel-url: ${KEYCLOAK_BACKCHANNEL_URL:${keycloak.url}}
  # Client alp-admin (Service accounts) để backend gọi Admin API qua địa chỉ backchannel (CN-22).
  # Secret mặc định để trống: test và CI không gọi KeyCloak thật nên không cần secret.
  admin-client-id: alp-admin
  admin-client-secret: ${KC_ADMIN_CLIENT_SECRET:}

management:
  health:
    # Có Spring Mail thì Actuator tự kiểm kết nối SMTP; Mailpit tắt là /actuator/health báo DOWN và Compose
    # không bật web. Mail chỉ là thông báo (gửi lỗi thì ghi log), nên không tính vào sức khỏe của backend.
    mail:
      enabled: false

logging:
  pattern:
    # Thêm mã request (RequestIdFilter gán cho mỗi request vào /api) sau mức log; ngoài request /api thì để trống.
    level: "%5p [%X{requestId:-}]"

mybatis:
  # File SQL (XML) nằm trong resources, cùng đường dẫn package với Mapper của module.
  mapper-locations: classpath*:io/github/arielne/alp/**/*Mapper.xml
  # Cho phép ghi tên class ngắn (ví dụ Branch) trong file XML thay vì ghi đủ package.
  type-aliases-package: io.github.arielne.alp
  configuration:
    # Cột branch_id tự gán vào thuộc tính branchId.
    map-underscore-to-camel-case: true