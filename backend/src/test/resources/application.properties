# Cấu hình riêng cho test. Spring Boot nạp file này cùng với application.yml; khóa nào có ở cả hai thì giá trị ở đây
# được dùng. Phần lớn test không chạy Kafka, nên tắt 3 phần đụng tới Kafka để Spring không đứng chờ Kafka ở mỗi lần
# khởi động: đẩy outbox sang Kafka, consumer của notification, tạo topic lúc khởi động. Test của luồng mail
# (notification/MailFlowIT) bật lại bằng @SpringBootTest(properties = ...) và chạy Kafka của Testcontainers.
alp.outbox.publisher-enabled=false
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false