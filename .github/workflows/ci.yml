# CI của Account Lifecycle Portal: build và chạy test cho backend và frontend.
# Chạy khi mở hoặc cập nhật Pull Request vào develop, main, và khi push lên develop.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# Workflow chỉ cần đọc code, không cần quyền ghi vào repo.
permissions:
  contents: read

# Action ghim theo SHA của commit, phiên bản ghi ở cuối dòng: tag như v7 có thể bị dời sang code khác, SHA thì không.
# Nâng phiên bản thì đổi cả SHA lẫn ghi chú.

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cài JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify chạy cả test nhanh (*Test) lẫn test chậm (*IT, Testcontainers) rồi tạo báo cáo JaCoCo.
      # Runner Ubuntu của GitHub có sẵn Docker nên Testcontainers chạy được.
      - name: Build và chạy toàn bộ test
        run: ./mvnw -B verify
      - name: Tải báo cáo JaCoCo lên làm artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cài Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci cài đúng phiên bản đã ghi trong package-lock.json.
      - name: Cài thư viện
        run: npm ci
      - name: Kiểm tra code bằng oxlint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Chạy test
        run: npm test