# CI của Account Lifecycle Portal: build và chạy test cho backend và frontend.
# Chạy khi mở hoặc cập nhật Pull Request vào develop, main, và khi push lên develop.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# Workflow chỉ cần đọc code, không cần quyền ghi vào repo.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Cài JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify chạy cả test nhanh (*Test) lẫn test chậm (*IT, Testcontainers) rồi tạo báo cáo JaCoCo.
      # Runner Ubuntu của GitHub có sẵn Docker nên Testcontainers chạy được.
      - name: Build và chạy toàn bộ test
        run: ./mvnw -B verify
      - name: Tải báo cáo JaCoCo lên làm artifact
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Cài Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci cài đúng phiên bản đã ghi trong package-lock.json.
      - name: Cài thư viện
        run: npm ci
      - name: Kiểm tra code bằng oxlint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Chạy test
        run: npm test